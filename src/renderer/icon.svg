
  <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
      <!-- Background Gradient -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="50%" stop-color="#090d16" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>

      <!-- Top Layer Gradient -->
      <linearGradient id="topLayer" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#60a5fa" />
        <stop offset="100%" stop-color="#2563eb" />
      </linearGradient>

      <!-- Middle Layer Gradient -->
      <linearGradient id="midLayer" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#1d4ed8" />
      </linearGradient>

      <!-- Bottom Layer Gradient -->
      <linearGradient id="botLayer" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#1e40af" />
      </linearGradient>

      <!-- Glow filter -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="12" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <!-- Border Gradient -->
      <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
      </linearGradient>
    </defs>

    <!-- App Icon Base Squircle -->
    <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

    <!-- Ambient Glow behind stack -->
    <circle cx="256" cy="256" r="140" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />

    <!-- Stack Layer 3 (Bottom) -->
    <path d="M 120 320 L 256 390 L 392 320 L 256 250 Z" fill="url(#botLayer)" opacity="0.9" />
    <path d="M 120 320 L 256 390 L 256 408 L 120 338 Z" fill="#1e3a8a" />
    <path d="M 256 390 L 392 320 L 392 338 L 256 408 Z" fill="#172554" />

    <!-- Stack Layer 2 (Middle) -->
    <path d="M 120 250 L 256 320 L 392 250 L 256 180 Z" fill="url(#midLayer)" opacity="0.95" />
    <path d="M 120 250 L 256 320 L 256 268 L 120 198 Z" fill="#1e40af" />
    <path d="M 256 320 L 392 250 L 392 268 L 256 338 Z" fill="#1e3a8a" />

    <!-- Stack Layer 1 (Top) -->
    <path d="M 120 180 L 256 250 L 392 180 L 256 110 Z" fill="url(#topLayer)" />
    <path d="M 120 180 L 256 250 L 256 198 L 120 128 Z" fill="#2563eb" />
    <path d="M 256 250 L 392 180 L 392 198 L 256 268 Z" fill="#1d4ed8" />

    <!-- Highlight Rim on Top Layer -->
    <path d="M 120 180 L 256 250 L 392 180" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 256 110 L 392 180" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 120 180 L 256 110" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round" fill="none" />
  </svg>
  